name: Build KBridge Release EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build optimized kbridge.exe
        run: cargo build --release

      - name: Upload kbridge.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbridge-win64
          path: |
            target/release/kbridge.exe
            README.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0-latest
          name: "KBridge v0.6.0 Ultimate + HD 4400 Dual-GPU ZeroLag-X Frame Gen"
          body: "v0.6.0 release: adds custom Dual-GPU Offload D3D11 2x Frame Generation locked exclusively to Intel HD Graphics 4400 (Pyramid Optical Flow, Ultra-Lite Lucas-Kanade PS 4.0, Adaptive Video Smoother) + custom ZeroLag-X Predictive Extrapolation with live mouse-delta camera vector injection and 1-frame waitable flip queue."
          prerelease: false
          files: |
            target/release/kbridge.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
