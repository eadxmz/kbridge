name: Build KBridge Release EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build optimized kbridge.exe
        run: cargo build --release

      - name: Upload kbridge.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbridge-win64
          path: |
            target/release/kbridge.exe
            README.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-latest
          name: "KBridge v0.5.0 Ultimate (Ironlake + HD 4400)"
          body: "v0.5.0 multi-gen release: full Ironlake (15.22.58.2993) + Haswell HD Graphics 4400 (15.36/15.40) support, UTF-16LE INF parser, 25+ GPU/media/DPST/PSR flags, 512MB GMM unlock, MMCSS Playback+Games GPU Priority 8, 100% core unparking, Intel Graphics Power Plan unlock, SeProfileSingleProcessPrivilege Standby RAM purge, all-core browser/media booster for 1440p60, and Firefox user.js tuner."
          prerelease: false
          files: |
            target/release/kbridge.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
