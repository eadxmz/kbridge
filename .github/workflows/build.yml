name: Build KBridge Release EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build optimized kbridge.exe
        run: cargo build --release

      - name: Upload kbridge.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbridge-win64
          path: |
            target/release/kbridge.exe
            README.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-latest
          name: "KBridge Latest Build (kbridge.exe)"
          body: "v0.4.1 release: fixes HWINEVENTHOOK E0308 build error, runs daemon 100% invisibly via FreeConsole + CREATE_NO_WINDOW, registers Priority-0 instant logon scheduled task (zero boot delay), and bypasses win32k GDI LUT caching so Windows Settings -> Display can never revert gamma/contrast."
          prerelease: false
          files: |
            target/release/kbridge.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
