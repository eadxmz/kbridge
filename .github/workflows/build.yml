name: Build KBridge Release EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build optimized kbridge.exe
        run: cargo build --release

      - name: Upload kbridge.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbridge-win64
          path: |
            target/release/kbridge.exe
            README.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-latest
          name: "KBridge Latest Build (kbridge.exe)"
          body: "Anti-stutter v0.4.0 release: event-driven WinEvent foreground hook (eliminates 3s polling spikes), conditional gamma ramp updates, PCIe ASPM + 100% CPU min-state powercfg tuning, MMCSS GPU priority=8, DWM hardware overlay disable for WDDM 1.1, and 60s Standby RAM cooldown."
          prerelease: false
          files: |
            target/release/kbridge.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
