[package]
name = "kbridge"
version = "0.5.0"
edition = "2021"
description = "Intel HD Graphics (Ironlake + HD 4400) Ultimate Win10/11 Patcher & 1440p60 Anti-Stutter Daemon"
build = "build.rs"

[dependencies]
winreg = "0.52"
anyhow = "1.0"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
