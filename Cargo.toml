[package]
name = "kbridge"
version = "0.1.0"
edition = "2021"
description = "Intel HD Graphics (15.22.58.2993) Win10/11 Patcher & Low-Overhead Daemon"
build = "build.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
winreg = "0.52"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
