[package]
name = "kbridge"
version = "0.3.1"
edition = "2021"
description = "Intel HD Graphics (15.22.58.2993) Win10/11 Interactive Patcher & Low-Overhead Daemon"
build = "build.rs"

[dependencies]
winreg = "0.52"
anyhow = "1.0"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
